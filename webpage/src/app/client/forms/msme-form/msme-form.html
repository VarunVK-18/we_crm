
<div class="pf-container">
  <div class="pf-header">
    <button class="pf-back-btn" (click)="goBack()"><span class="material-symbols-outlined">arrow_back</span></button>
    <h2>MSME / Udyam Registration</h2>
  </div>

  <app-we-loader *ngIf="isSubmitting()"></app-we-loader>

  <form class="pf-form" (ngSubmit)="submitForm()" *ngIf="!isSuccess() && !isSubmitting()" #msmeForm="ngForm">
    
    <!-- 1. Applicant / Entrepreneur Details -->
    <div class="pf-section">
      <h3>1. Applicant / Entrepreneur Details</h3>
      <div class="pf-grid">
        <div class="pf-field full-width">
          <label>Aadhar Number *</label>
          <input type="text" name="aadhaarNumber" [(ngModel)]="aadhaarNumber" required pattern="[0-9]{12}">
        </div>
        <div class="pf-field full-width">
          <label>Name of Entrepreneur *</label>
          <input type="text" name="entrepreneurName" [(ngModel)]="entrepreneurName" required>
        </div>
        <div class="pf-field">
          <label>Mobile Number *</label>
          <input type="text" name="mobileNumber" [(ngModel)]="mobileNumber" required pattern="[0-9]{10}">
        </div>
        <div class="pf-field">
          <label>Email *</label>
          <input type="email" name="email" [(ngModel)]="email" required>
        </div>
      </div>
    </div>

    <!-- 2. Organization Details -->
    <div class="pf-section">
      <h3>2. Organization Details</h3>
      <div class="pf-grid">
        <div class="pf-field full-width">
          <label>Type of Organization *</label>
          <div class="radio-group-wrap">
            <label><input type="radio" name="orgType" value="Proprietorship" [(ngModel)]="orgType"> Proprietorship</label>
            <label><input type="radio" name="orgType" value="Partnership" [(ngModel)]="orgType"> Partnership</label>
            <label><input type="radio" name="orgType" value="LLP" [(ngModel)]="orgType"> LLP</label>
            <label><input type="radio" name="orgType" value="Private Limited" [(ngModel)]="orgType"> Private Limited</label>
            <label><input type="radio" name="orgType" value="OPC" [(ngModel)]="orgType"> OPC</label>
            <label><input type="radio" name="orgType" value="Trust" [(ngModel)]="orgType"> Trust</label>
            <label><input type="radio" name="orgType" value="Society" [(ngModel)]="orgType"> Society</label>
          </div>
        </div>
        <div class="pf-field full-width">
          <label>Name of Enterprise *</label>
          <input type="text" name="enterpriseName" [(ngModel)]="enterpriseName" (ngModelChange)="onEntityNameChange($event)" required>
        </div>
        <div class="pf-field full-width">
          <label>Date of Incorporation *</label>
          <input type="date" name="incorporationDate" [(ngModel)]="incorporationDate" required>
        </div>
      </div>
    </div>

    <!-- 3. PAN & GST Details -->
    <div class="pf-section">
      <h3>3. PAN & GST Details</h3>
      <div class="pf-grid">
        <div class="pf-field">
          <label>PAN *</label>
          <input type="text" name="pan" [(ngModel)]="pan" required style="text-transform: uppercase;">
        </div>
        <div class="pf-field">
          <label>Name of PAN Holder *</label>
          <input type="text" name="panName" [(ngModel)]="panName" required>
        </div>
        <div class="pf-field full-width">
          <label>DOB OR DOI (Date of Incorporation) as per PAN *</label>
          <input type="date" name="panDob" [(ngModel)]="panDob" required>
        </div>
        <div class="pf-field full-width">
          <label>Do you have GSTIN *</label>
          <div class="radio-group">
            <label><input type="radio" name="hasGstin" value="Yes" [(ngModel)]="hasGstin"> Yes</label>
            <label><input type="radio" name="hasGstin" value="No" [(ngModel)]="hasGstin"> No</label>
            <label><input type="radio" name="hasGstin" value="Exempted" [(ngModel)]="hasGstin"> Exempted</label>
          </div>
        </div>
        <div class="pf-field full-width" *ngIf="hasGstin === 'Yes'">
          <label>GST Number *</label>
          <input type="text" name="gstinNumber" [(ngModel)]="gstinNumber" [required]="hasGstin === 'Yes'" style="text-transform: uppercase;">
        </div>
      </div>
    </div>

    <!-- 4. Business Details -->
    <div class="pf-section">
      <h3>4. Business Details</h3>
      <div class="pf-grid">
        <div class="pf-field">
          <label>Total Investment Made in Business *</label>
          <input type="number" name="investment" [(ngModel)]="investment" required>
        </div>
        <div class="pf-field">
          <label>Turnover in Last FY 25-26 *</label>
          <input type="number" name="turnover" [(ngModel)]="turnover" required>
        </div>
        <div class="pf-field full-width">
          <label>Office Name *</label>
          <input type="text" name="officeName" [(ngModel)]="officeName" required>
        </div>
        <div class="pf-field full-width">
          <label>Major Activity of Unit *</label>
          <div class="radio-group">
            <label><input type="radio" name="majorActivity" value="Manufacturing" [(ngModel)]="majorActivity"> Manufacturing</label>
            <label><input type="radio" name="majorActivity" value="Services" [(ngModel)]="majorActivity"> Services</label>
            <label><input type="radio" name="majorActivity" value="Trading" [(ngModel)]="majorActivity"> Trading</label>
          </div>
        </div>
        <div class="pf-field full-width">
          <label>Office Address *</label>
          <textarea name="officeAddress" [(ngModel)]="officeAddress" required rows="3"></textarea>
        </div>
      </div>
    </div>

    <!-- 5. Social & Category Details -->
    <div class="pf-section">
      <h3>5. Social & Category Details</h3>
      <div class="pf-grid">
        <div class="pf-field full-width">
          <label>Social Category *</label>
          <div class="radio-group">
            <label><input type="radio" name="socialCategory" value="General" [(ngModel)]="socialCategory"> General</label>
            <label><input type="radio" name="socialCategory" value="SC" [(ngModel)]="socialCategory"> SC</label>
            <label><input type="radio" name="socialCategory" value="ST" [(ngModel)]="socialCategory"> ST</label>
            <label><input type="radio" name="socialCategory" value="OBC" [(ngModel)]="socialCategory"> OBC</label>
          </div>
        </div>
        <div class="pf-field full-width">
          <label>Gender *</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" [(ngModel)]="gender"> Male</label>
            <label><input type="radio" name="gender" value="Female" [(ngModel)]="gender"> Female</label>
            <label><input type="radio" name="gender" value="Others" [(ngModel)]="gender"> Others</label>
          </div>
        </div>
        <div class="pf-field full-width">
          <label>Specially Abled (DIVYANG) *</label>
          <div class="radio-group">
            <label><input type="radio" name="isDivyang" value="Yes" [(ngModel)]="isDivyang"> Yes</label>
            <label><input type="radio" name="isDivyang" value="No" [(ngModel)]="isDivyang"> No</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 6. Bank Details -->
    <div class="pf-section">
      <h3>6. Bank Details</h3>
      <div class="pf-grid">
        <div class="pf-field full-width">
          <label>Bank Name *</label>
          <input type="text" name="bankName" [(ngModel)]="bankName" required>
        </div>
        <div class="pf-field">
          <label>IFS Code *</label>
          <input type="text" name="ifsCode" [(ngModel)]="ifsCode" required style="text-transform: uppercase;">
        </div>
        <div class="pf-field">
          <label>Bank Account Number *</label>
          <input type="text" name="bankAccount" [(ngModel)]="bankAccount" required pattern="[0-9]+">
        </div>
      </div>
    </div>

    <!-- 7. Employee Details -->
    <div class="pf-section">
      <h3>7. Employee Details</h3>
      <div class="pf-grid">
        <div class="pf-field">
          <label>No. of Persons Employed (Male) *</label>
          <input type="number" name="maleEmployees" [(ngModel)]="maleEmployees" required min="0">
        </div>
        <div class="pf-field">
          <label>No. of Persons Employed (Female) *</label>
          <input type="number" name="femaleEmployees" [(ngModel)]="femaleEmployees" required min="0">
        </div>
        <div class="pf-field full-width">
          <label>Total Employees *</label>
          <input type="number" name="totalEmployees" [value]="totalEmployees()" disabled>
        </div>
      </div>
    </div>

    <!-- 8. TReDS Registration -->
    <div class="pf-section">
      <h3>8. TReDS Registration</h3>
      <div class="pf-grid">
        <div class="pf-field full-width">
          <label>Are you interested in getting registered on TReDS Portals? *</label>
          <div class="radio-group">
            <label><input type="radio" name="tredsInterested" value="Yes" [(ngModel)]="tredsInterested"> Yes</label>
            <label><input type="radio" name="tredsInterested" value="No" [(ngModel)]="tredsInterested"> No</label>
          </div>
        </div>
      </div>
    </div>

    <div class="pf-error-message" *ngIf="errorMessage()">
      <span class="material-symbols-outlined">error</span>
      {{ errorMessage() }}
    </div>

    <div class="pf-actions">
      <button type="button" class="pf-btn pf-btn-secondary" (click)="saveDraft()" [disabled]="isSubmitting()">
        <span class="material-symbols-outlined">save</span> Save Draft
      </button>
      <button type="submit" class="pf-btn pf-btn-primary" [disabled]="!msmeForm.valid || isSubmitting()">
        <span class="material-symbols-outlined" *ngIf="!isSubmitting()">send</span>
        {{ isSubmitting() ? 'Submitting...' : 'Submit Application' }}
      </button>
    </div>
  </form>

  <div class="pf-success" *ngIf="isSuccess()">
    <span class="material-symbols-outlined success-icon">check_circle</span>
    <h3>Application Submitted Successfully!</h3>
    <button class="pf-btn pf-btn-primary" (click)="location.back()">Return to Dashboard</button>
  </div>
</div>
